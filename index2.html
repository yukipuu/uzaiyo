<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うざいやつに水かけろ！</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#e9faff;color:#222}
button{border:0;border-radius:999px;background:#159eea;color:#fff;font-size:21px;font-weight:900;padding:14px 34px;box-shadow:0 6px 0 #0877b5}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #0877b5}
.screen{width:100%;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#start{background:linear-gradient(#e7faff,#fff)}
#title{width:min(88vw,520px);max-height:35svh;object-fit:contain;margin-bottom:22px}
#game{display:none;position:fixed;inset:0;background:linear-gradient(#e8fbff,#fff);overflow:hidden}
.hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-around;z-index:30;font-weight:900;font-size:18px;padding:8px}
#field{position:absolute;inset:0}
.target{position:absolute;width:min(38vw,210px);max-height:32vh;object-fit:contain;touch-action:none;user-select:none;-webkit-user-drag:none}
#spray{position:fixed;right:14px;bottom:max(18px,env(safe-area-inset-bottom));width:min(30vw,150px);z-index:25;pointer-events:none}
#effect{position:fixed;width:min(35vw,190px);z-index:40;pointer-events:none;display:none}
#message{position:fixed;left:0;right:0;top:47%;font-size:30px;font-weight:900;z-index:50;pointer-events:none;opacity:0}
#result{display:none;background:linear-gradient(#e7faff,#fff)}
.score{font-size:70px;font-weight:900;line-height:1;margin:8px}
.small{font-size:16px;line-height:1.7;margin:12px 20px 24px}
</style>
</head>
<body>
<section id="start" class="screen">
<img id="title" src="title.png" alt="うざいやつに水かけろ！">
<button id="startBtn">START！</button>
</section>
<section id="game">
<div class="hud"><div>💦 <span id="score">0</span>匹撃退</div><div>⏱ <span id="time">15</span>秒</div></div>
<div id="field"></div>
<img id="spray" src="sprayer.png" alt="">
<img id="effect" src="splash.png" alt="">
<div id="message">命中！💦</div>
</section>
<section id="result" class="screen">
<h1>ゲーム終了！</h1><div class="score" id="finalScore">0</div><div>匹撃退！</div>
<p class="small" id="rank"></p><button id="againBtn">もう一回！</button>
</section>
<script>
const assets=[
{normal:"mos.PNG",wet:"moswet.PNG",name:"蚊"},
{normal:"fly.PNG",wet:"flywet.PNG",name:"ハエ"},
{normal:"cockroach.png",wet:"cockwet.PNG",name:"ゴキブリ"},
{normal:"caterpillar.png",wet:"catewet.PNG",name:"毛虫"},
{normal:"girl.PNG",wet:"girlwet.PNG",name:"ウザイ女子"}
];
const game=document.getElementById("game"),start=document.getElementById("start"),result=document.getElementById("result"),field=document.getElementById("field"),scoreEl=document.getElementById("score"),timeEl=document.getElementById("time"),effect=document.getElementById("effect"),message=document.getElementById("message");
let score=0,time=15,timer=null,moveTimer=null,target=null,locked=false;
function pickAsset(){return assets[Math.floor(Math.random()*assets.length)]}
function placeTarget(){
if(!target||locked)return;
const w=Math.max(20,innerWidth-target.offsetWidth-20),h=Math.max(100,innerHeight-target.offsetHeight-115);
target.style.left=(10+Math.random()*w*.9)+"px";target.style.top=(70+Math.random()*Math.max(60,h-70))+"px";
}
function makeTarget(){
if(target){target.remove();target=null}
const a=pickAsset();target=document.createElement("img");target.className="target";target.src=a.normal;target.alt=a.name;target.dataset.wet=a.wet;
target.addEventListener("pointerdown",hit,{passive:false});field.appendChild(target);placeTarget();
}
function showEffect(x,y){
effect.style.left=(x-effect.offsetWidth/2)+"px";effect.style.top=(y-effect.offsetHeight/2)+"px";effect.style.display="block";setTimeout(()=>effect.style.display="none",260);
}
function hit(e){
e.preventDefault();if(locked||!target)return;locked=true;score++;scoreEl.textContent=score;
const r=target.getBoundingClientRect();showEffect(r.left+r.width/2,r.top+r.height/2);
target.src=target.dataset.wet;target.style.transform="scale(1.08) rotate(12deg)";
message.textContent=target.dataset.name+" 撃退！💦";message.style.opacity=1;setTimeout(()=>message.style.opacity=0,380);
setTimeout(()=>{if(target){target.remove();target=null}locked=false;if(time>0)makeTarget()},430);
}
function startGame(){
clearInterval(timer);clearInterval(moveTimer);score=0;time=15;locked=false;scoreEl.textContent=0;timeEl.textContent=15;
start.style.display="none";result.style.display="none";game.style.display="block";makeTarget();
moveTimer=setInterval(()=>{if(!locked)placeTarget()},1350);
timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000);
}
function endGame(){
clearInterval(timer);clearInterval(moveTimer);if(target){target.remove();target=null}game.style.display="none";result.style.display="flex";
document.getElementById("finalScore").textContent=score;
document.getElementById("rank").textContent=score>=12?"🌟 水かけマスター！":score>=7?"😎 なかなかの撃退力！":score>=3?"🤣 もうちょっと水かけよ！":"😂 ウザいやつに完敗……";
}
document.getElementById("startBtn").onclick=startGame;document.getElementById("againBtn").onclick=startGame;
addEventListener("resize",()=>{if(game.style.display==="block")placeTarget()});
</script>
</body>
</html>
