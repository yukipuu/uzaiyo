<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うざいやつに水かけろ！</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#dff7ff,#fff);color:#222;overflow:hidden}
#app{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:18px}
.screen{width:min(560px,100%);text-align:center}
h1{font-size:clamp(28px,8vw,48px);margin:8px 0 10px;font-weight:900}
.sub{font-size:16px;margin-bottom:22px}
button{border:0;border-radius:999px;background:#159eea;color:white;font-size:22px;font-weight:800;padding:14px 34px;box-shadow:0 6px 0 #0877b5}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #0877b5}
#game{display:none;width:100%;height:100svh;position:fixed;inset:0;background:linear-gradient(#e8fbff,#fff)}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-around;z-index:20;font-weight:900;font-size:18px}
#field{position:absolute;inset:0}
#bug{position:absolute;width:min(48vw,250px);height:auto;touch-action:none;user-select:none}
#message{position:fixed;left:0;right:0;top:48%;font-size:28px;font-weight:900;pointer-events:none;opacity:0;z-index:40}
#result{display:none}
.score{font-size:64px;font-weight:900;margin:8px}
.small{font-size:15px;line-height:1.7;margin:14px 20px 22px}
</style>
</head>
<body>
<div id="app">
  <section id="start" class="screen">
    <h1>うざいやつに<br>水かけろ！💦</h1>
    <div class="sub">15秒で、何匹撃退できるかな？</div>
    <button id="startBtn">START！</button>
  </section>
  <section id="result" class="screen">
    <h1>ゲーム終了！</h1>
    <div class="score" id="finalScore">0</div>
    <div>匹撃退！</div>
    <p class="small" id="rank"></p>
    <button id="againBtn">もう一回！</button>
  </section>
</div>

<div id="game">
  <div class="hud"><div>💦 <span id="score">0</span>匹</div><div>⏱ <span id="time">15</span>秒</div></div>
  <div id="field"><img id="bug" src="mos.PNG" alt="うざい虫"></div>
  <div id="message">命中！💦</div>
</div>

<script>
const game=document.getElementById('game');
const start=document.getElementById('start');
const result=document.getElementById('result');
const bug=document.getElementById('bug');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const msg=document.getElementById('message');
let score=0,time=15,timer=null,moveTimer=null;

function placeBug(){
  const w=Math.max(120,innerWidth-bug.offsetWidth-20);
  const h=Math.max(220,innerHeight-bug.offsetHeight-90);
  bug.style.left=(10+Math.random()*w*.85)+'px';
  bug.style.top=(65+Math.random()*Math.max(100,h-65))+'px';
}
function startGame(){
  score=0;time=15;scoreEl.textContent=0;timeEl.textContent=15;
  start.style.display='none';result.style.display='none';game.style.display='block';
  placeBug();
  clearInterval(timer);clearInterval(moveTimer);
  timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000);
  moveTimer=setInterval(placeBug,900);
}
function hit(e){
  e.preventDefault();
  score++;scoreEl.textContent=score;
  msg.style.opacity=1;
  setTimeout(()=>msg.style.opacity=0,180);
  placeBug();
}
function endGame(){
  clearInterval(timer);clearInterval(moveTimer);
  game.style.display='none';result.style.display='block';
  document.getElementById('finalScore').textContent=score;
  const r=score>=12?'🌟 水かけマスター！':score>=7?'😎 なかなかの撃退力！':score>=3?'🤣 もうちょっと水かけよ！':'😂 虫に完敗……';
  document.getElementById('rank').textContent=r;
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('againBtn').onclick=startGame;
bug.addEventListener('pointerdown',hit);
addEventListener('resize',()=>{if(game.style.display==='block')placeBug()});
</script>
</body>
</html>
