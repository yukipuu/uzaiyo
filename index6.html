<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うざいやつに水かけろ！</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#fff;background:#111}
#start,#result{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
background:radial-gradient(circle at 20% 25%,rgba(120,105,80,.20),transparent 28%),radial-gradient(circle at 80% 70%,rgba(70,85,95,.16),transparent 30%),linear-gradient(135deg,#151817 0%,#25231e 48%,#101313 100%)}
.screen{width:min(560px,100%)}
h1{font-size:clamp(30px,9vw,52px);line-height:1.15;margin:0 0 12px;font-weight:900;text-shadow:0 3px 12px #000}
.sub{font-size:16px;line-height:1.7;color:#ddd;margin-bottom:26px}
button{border:0;border-radius:999px;background:#39a9ed;color:white;font-size:22px;font-weight:900;padding:15px 38px;box-shadow:0 6px 0 #176c9e}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #176c9e}
#game{display:none;position:fixed;inset:0;background:#181915}
#room{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.48)),radial-gradient(ellipse at 50% 35%,#625a48 0%,#35332b 42%,#151716 85%)}
#room:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.42),transparent 22%,transparent 78%,rgba(0,0,0,.45)),linear-gradient(0deg,rgba(0,0,0,.60),transparent 30%);pointer-events:none}
#lamp{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:90px;border-radius:0 0 60px 60px;background:radial-gradient(ellipse at 50% 15%,rgba(255,226,151,.75),rgba(255,226,151,.08) 55%,transparent 70%);opacity:.7}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:30;display:flex;justify-content:space-between;gap:10px;font-weight:900;font-size:18px;text-shadow:0 2px 5px #000}
.badge{background:rgba(0,0,0,.48);padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.12)}
#field{position:absolute;inset:0}
#bug{position:absolute;width:min(34vw,190px);max-height:230px;object-fit:contain;touch-action:none;user-select:none;z-index:10;filter:drop-shadow(0 8px 8px rgba(0,0,0,.55))}
.effect{position:absolute;display:none;pointer-events:none;transform:translate(-50%,-50%);z-index:20}
#spray{width:120px;z-index:22}
#splash{width:150px;z-index:21}
#impact{width:150px;z-index:23}
#splash2{width:115px;z-index:21}
#message{position:fixed;left:0;right:0;top:44%;z-index:40;text-align:center;font-size:30px;font-weight:900;text-shadow:0 3px 8px #000;opacity:0;pointer-events:none}
#plus{position:fixed;z-index:50;font-size:34px;font-weight:900;text-shadow:0 3px 8px #000;opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:35;pointer-events:none}
#girlMsg{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%) scale(.7) rotate(-5deg);z-index:60;font-size:clamp(24px,7vw,42px);font-weight:900;color:#ff79a8;text-shadow:0 3px 0 #fff,0 5px 12px #000;opacity:0;pointer-events:none;white-space:nowrap}
.score{font-size:72px;font-weight:900;margin:8px;text-shadow:0 4px 10px #000}
.small{font-size:15px;line-height:1.8;color:#ddd;margin:14px 20px 24px}
.note{margin-top:22px;font-size:13px;color:#aaa}

/* --- ゲーム感アップ：タイトル画面 --- */
#start{position:relative;overflow:hidden;background:
  radial-gradient(circle at 50% 28%,rgba(255,210,120,.30),transparent 22%),
  linear-gradient(rgba(18,16,12,.18),rgba(8,9,9,.68)),
  radial-gradient(ellipse at 50% 45%,#665a45 0%,#343127 43%,#0d1010 100%)}
#start:before{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(90deg,rgba(0,0,0,.48),transparent 25%,transparent 75%,rgba(0,0,0,.52)),
linear-gradient(0deg,rgba(0,0,0,.68),transparent 42%)}
.startCard{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 18px 26px}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:2px;font-weight:900;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.14);padding:7px 13px;border-radius:999px;margin-bottom:9px;box-shadow:0 5px 18px #0008}
.titleBox{position:relative;line-height:.9;margin:2px 0 5px;transform:rotate(-2deg);filter:drop-shadow(0 7px 5px #000)}
.titleLine{font-size:clamp(43px,14vw,74px);font-weight:1000;-webkit-text-stroke:4px #241d16;text-shadow:0 5px 0 #111,0 8px 15px #000;letter-spacing:-3px}
.titleLine.yellow{color:#ffd33d}.titleLine.pink{color:#ff6f9f}.titleLine.blue{color:#5fc7ff}
.splashWord{font-size:24px;letter-spacing:5px;margin:2px 0 5px;filter:drop-shadow(0 3px 3px #000)}
.startCard .sub{margin:7px 0 18px;color:#f2eee6;text-shadow:0 2px 5px #000}
.startBig{font-size:27px;min-width:210px;padding:15px 48px;background:linear-gradient(#ff77ae,#ed3f83);box-shadow:0 7px 0 #9c2455,0 12px 22px #0008;border:2px solid #ffb8d3}
.startBig:active{box-shadow:0 3px 0 #9c2455}
.floating{position:absolute;z-index:-1;pointer-events:none;filter:drop-shadow(0 7px 6px #000)}
.floating img{width:100%;height:100%;object-fit:contain}
.f1{width:115px;height:95px;top:11%;left:7%;transform:rotate(-12deg)}
.f2{width:82px;height:72px;top:28%;right:8%;transform:rotate(16deg)}
.f3{width:115px;height:78px;bottom:22%;left:3%;transform:rotate(-7deg)}
.f4{width:100px;height:82px;bottom:26%;right:2%;transform:rotate(8deg)}
.web{position:absolute;color:#aaa8a0;opacity:.23;font-size:65px;font-weight:100;z-index:-1}
.web1{top:2%;left:-8%;transform:rotate(25deg)}.web2{top:9%;right:-5%;transform:rotate(-28deg)}
/* --- 結果画面もポスター風に --- */
#result{position:relative;overflow:hidden}
#result:before{content:"💦     ✦     💦     ✦     💦";position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:24px;white-space:nowrap;opacity:.45}
#result .screen{position:relative;padding:28px 20px;border:1px solid rgba(255,255,255,.10);border-radius:28px;background:rgba(10,11,10,.38);box-shadow:0 18px 45px #0008;backdrop-filter:blur(4px)}
#result h1{font-size:clamp(34px,10vw,54px);color:#eaf7ff}
#result .score{color:#fff;font-size:clamp(76px,22vw,112px);line-height:1}
#result button{background:linear-gradient(#ff77ae,#ed3f83);box-shadow:0 6px 0 #9c2455;border:2px solid #ffb8d3}

</style>
</head>
<body>
<section id="start"><div class="screen startCard">
  <div class="web web1">╲╱╲╱</div>
  <div class="web web2">╲╱</div>
  <div class="floating f1"><img src="fly.PNG" alt=""></div>
  <div class="floating f2"><img src="mos.PNG" alt=""></div>
  <div class="floating f3"><img src="caterpillar.png" alt=""></div>
  <div class="floating f4"><img src="cockroach.png" alt=""></div>

  <div class="eyebrow">💦 WATER SPRAY GAME</div>
  <div class="titleBox">
    <div class="titleLine yellow">うざい</div>
    <div class="titleLine pink">やつに</div>
    <div class="titleLine blue">水かけろ！</div>
  </div>
  <div class="splashWord">💦💦💦</div>
  <div class="sub">薄暗い部屋に潜む「うざいやつ」を<br><b>15秒でどれだけ撃退できる？</b></div>
  <button id="startBtn" class="startBig">START！</button>
  <div class="note">※虫だけじゃない。アイツも出る……🤣</div>
</div></section>

<section id="result"><div class="screen">
<h1>ゲーム終了！</h1><div class="score" id="finalScore">0</div><div>匹撃退！</div>
<p class="small" id="rank"></p><button id="againBtn">もう一回！</button>
</div></section>

<div id="game">
<div id="room"><div id="lamp"></div></div>
<div class="hud"><div class="badge">💦 <span id="score">0</span>撃退</div><div class="badge">⏱ <span id="time">15</span>秒</div></div>
<div id="field">
<img id="bug" alt="うざいやつ">
<img id="spray" class="effect" src="sprayer.png" alt="">
<img id="splash" class="effect" src="splash.PNG" alt="">
<img id="splash2" class="effect" src="splashs.PNG" alt="">
<img id="impact" class="effect" src="impact.png" alt="">
</div>
<div id="message">命中！💦</div><div id="girlMsg">ちょっとーーー！！💢</div><div id="plus">＋1 💦</div><div id="flash"></div>
</div>

<script>
const game=document.getElementById('game'),start=document.getElementById('start'),result=document.getElementById('result');
const bug=document.getElementById('bug'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time');
const msg=document.getElementById('message'),girlMsg=document.getElementById('girlMsg'),plus=document.getElementById('plus'),flash=document.getElementById('flash');
const spray=document.getElementById('spray'),splash=document.getElementById('splash'),splash2=document.getElementById('splash2'),impact=document.getElementById('impact');

const targets=[
 {normal:'mos.PNG',wet:'moswet.PNG',name:'蚊'},
 {normal:'fly.PNG',wet:'flywet.PNG',name:'ハエ'},
 {normal:'cockroach.png',wet:'cockroach.png',name:'ゴキ'},
 {normal:'caterpillar.png',wet:'catewet.PNG',name:'毛虫'},
 {normal:'girl.PNG',wet:'girlwet.PNG',name:'ウザイ女子',rare:true}
];
let score=0,time=15,timer=null,moveTimer=null,current=null,busy=false;

function chooseTarget(){
 current=Math.random()<0.16?targets[4]:targets[Math.floor(Math.random()*4)];
 bug.src=current.normal; bug.alt=current.name;
}
function placeTarget(){
 const bw=bug.offsetWidth||150,bh=bug.offsetHeight||150;
 const maxX=Math.max(20,innerWidth-bw-20), maxY=Math.max(120,innerHeight-bh-80);
 bug.style.left=(10+Math.random()*maxX)+'px';
 bug.style.top=(70+Math.random()*Math.max(80,maxY-70))+'px';
}
function show(el,x,y,d=260){
 el.style.left=x+'px';el.style.top=y+'px';el.style.display='block';
 setTimeout(()=>el.style.display='none',d);
}
function startGame(){
 score=0;time=15;busy=false;scoreEl.textContent='0';timeEl.textContent='15';
 start.style.display='none';result.style.display='none';game.style.display='block';
 chooseTarget();placeTarget();clearInterval(timer);clearInterval(moveTimer);
 timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000);
 moveTimer=setInterval(()=>{if(!busy){chooseTarget();placeTarget()}},1050);
}
function hit(e){
 e.preventDefault(); if(busy||time<=0)return; busy=true; score++;scoreEl.textContent=score;
 const r=bug.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 show(spray,x,y,220);show(splash,x,y,280);show(splash2,x,y,330);show(impact,x,y,300);
 msg.textContent=current.rare?'ウザイ女子、撃退！🤣💦':current.name+'撃退！💦';msg.style.opacity='1';
 if(current.rare){
   girlMsg.textContent='ちょっとーーー！！💢'; girlMsg.style.opacity='1';
   girlMsg.animate([{transform:'translate(-50%,-50%) scale(.65) rotate(-8deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.12) rotate(5deg)',opacity:1},{transform:'translate(-50%,-50%) scale(1) rotate(-2deg)',opacity:1}],{duration:360,easing:'ease-out'});
   setTimeout(()=>{girlMsg.style.opacity='0'},650);
 }
 plus.style.left=x+'px';plus.style.top=(y-30)+'px';plus.style.opacity='1';
 plus.animate([{transform:'translate(-50%,0) scale(.7)'},{transform:'translate(-50%,-55px) scale(1.15)'},{transform:'translate(-50%,-80px) scale(1)',opacity:0}],{duration:500,easing:'ease-out'});
 flash.style.opacity='.16';setTimeout(()=>flash.style.opacity='0',70);
 bug.src=current.wet;bug.style.transition='transform .28s ease,opacity .28s ease';
 bug.style.transform='translate('+(Math.random()<.5?-1:1)*140+'px,80px) rotate('+(Math.random()<.5?-18:18)+'deg) scale(.85)';
 bug.style.opacity='.12';
 setTimeout(()=>{msg.style.opacity='0';bug.style.transition='';bug.style.transform='';bug.style.opacity='1';chooseTarget();placeTarget();busy=false},420);
}
function endGame(){
 clearInterval(timer);clearInterval(moveTimer);game.style.display='none';result.style.display='flex';
 document.getElementById('finalScore').textContent=score;
 document.getElementById('rank').textContent=score>=15?'🌟 水かけ神！ウザイやつ全滅レベル！':score>=10?'🏆 水かけマスター！':score>=5?'😎 なかなかの撃退力！':score>=2?'🤣 もうちょっと水かけよ！':'😂 ウザイやつに完敗……';
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('againBtn').onclick=startGame;
bug.addEventListener('pointerdown',hit);
addEventListener('resize',()=>{if(game.style.display==='block')placeTarget()});
</script>
</body>
</html>
